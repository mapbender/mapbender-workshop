                                                           dancing: dancing
                                                           flowers: flowers
                                                    -
                                                        type: fieldSet
                                                        children:
                                                            -
                                                                type: checkbox
                                                                title: 'public (this new object is public)'
                                                                name: public
                                                                value: true
                                                                css:
                                                                    width: 50%
                                                            -
                                                                type: text
                                                                text: |
                                                                      'Status checkbox: ' + data.public
                                                                css:
                                                                    width: 50%

                                                    -   type: radioGroup
