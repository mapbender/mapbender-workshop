parameters:
    applications:
        mapbender_digitize_demo:
            title: Mapbender Digitize Demo
            screenshot: ~
            description: Try the Mapbender Digitize Demo with the Tables defined in the documentation.
            published: true
            persistentView: false
            template:  Mapbender\CoreBundle\Template\Fullscreen
            custom_css: null
            regionProperties:
              - name: sidepane
                properties:
                    name: accordion # tabs (for button) / accordion / list / NULL
                    align: left # right/left
                    closed: false # true/false
                    screenType: all # all/desktop/mobile
                    width: "300px"
                    resizable: true
              - name: footer
                properties:
                    item_alignment": right # right/left/center
                    screenType: all # all/desktop/mobile
                    generate_button_menu: false # true/false
                    menu_label: NULL # NULL or text
            layersets:
                main:
                    selected: true
                themes:
                    selected: true
                    mapbender_users:
                        type: wms
                        title: Mapbender Users
                        url: https://wms.wheregroup.com/cgi-bin/mapbender_user.xml
                        version: 1.3.0
                        layers:
                            4: { name: Mapbender_User,    title : User, visible: true, legendurl: https://wms.wheregroup.com/cgi-bin/mapbender_user.xml?version=1.3.0&service=WMS&request=GetLegendGraphic&sld_version=1.1.0&layer=Mapbender_User&format=image/png&STYLE=default }
                            5: { name: Mapbender_Names,   title : Name, visible: true, queryable: true}
                        info_format: text/html
                        visible: true
                        format: image/png
                        transparent: true
                        tiled: false
                        opacity: 100
                        isBaseSource: false
                        toggle: true
                        #refreshInterval: 5
                    fossgis:
                        type: wms
                        title: FOSSGIS Konferenzen
                        url: https://wms.wheregroup.com/cgi-bin/fossgis.xml
                        version: 1.3.0
                        layers:
                            6: { name: FOSSGIS, title : FOSSGIS Konferenz-Standorte, visible: true, queryable: true, legendurl: https://wms.wheregroup.com/cgi-bin/fossgis.xml?version=1.3.0&service=WMS&request=GetLegendGraphic&sld_version=1.1.0&layer=fossgis&format=image/png&STYLE=default }
                        info_format: text/html
                        visible: true
                        format: image/png
                        transparent: true
                        tiled: false
                        opacity: 100
                        isBaseSource: false
                        toggle: false
                    foss4g:
                        type: wms
                        title: FOSS4G Conferences
                        url: https://wms.wheregroup.com/cgi-bin/foss4g.xml
                        version: 1.3.0
                        layers:
                            6: { name: FOSS4G, title : FOSS4G Conference Locations, visible: true, queryable: true, legendurl: https://wms.wheregroup.com/cgi-bin/foss4g.xml?version=1.3.0&service=WMS&request=GetLegendGraphic&sld_version=1.1.0&layer=foss4g&format=image/png&STYLE=default }
                        info_format: text/html
                        visible: false
                        format: image/png
                        transparent: true
                        tiled: false
                        opacity: 100
                        isBaseSource: false
                        toggle: false
                background themes:
                    selected: true
                    osm:
                        type: wms
                        title: OSM Demo
                        url: https://osm-demo.wheregroup.com/service
                        version: 1.3.0
                        layers:
                            12: { name: osm,    title : OSM Demo WhereGroup,  visible: true }
                        info_format: text/html
                        visible: true
                        format: image/png
                        transparent: true
                        tiled: true
                        opacity: 100
                        isBaseSource: true
                    osm-transparent:
                        type: wms
                        title: OSM Demo
                        url: https://osm-demo.wheregroup.com/service
                        version: 1.3.0
                        layers:
                            12: { name: osm,    title : OSM Demo WhereGroup,  visible: true }
                        info_format: text/html
                        visible: false
                        format: image/png
                        transparent: true
                        tiled: true
                        opacity: 60
                        isBaseSource: true
                    osm-greyscale:
                        type: wms
                        title: OSM Demo
                        url: https://osm-demo.wheregroup.com/service
                        version: 1.3.0
                        layers:
                            13: { name:  osm-grey,    title : OSM Demo WhereGroup (greyscale),  visible: true }
                        info_format: text/html
                        visible: false
                        format: image/png
                        transparent: true
                        tiled: true
                        opacity: 100
                        isBaseSource: true
                    osm-wmts:
                        type: wmts
                        title: OpenStreetMap (OSM) Demo WhereGroup WMTS
                        isBaseSource: true
                        opacity: 100
                        url: https://osm-demo.wheregroup.com/wmts/1.0.0/WMTSCapabilities.xml
                        selected: false
                        allowSelected: true
                        toggle: false
                        allowToggle: true
                        layers:
                            osm:
                              title: OpenStreetMap (color)
                              active: true # if false, the layer is ignored (default: true)
                              selected: true # initial state of the layer. (default: true)
                              allowSelected: true # can the user change state in the layertree? If selected and allowSelected are both false, the layer is ignored. (default: true)
                            osm-grey:
                              title: OpenStreetMap (greyscale)
                              active: false # if false, the layer is ignored (default: true)
                              selected: true # initial state of the layer. (default: true)
                              allowSelected: true # can the user change state in the layertree? If selected and allowSelected are both false, the layer is ignored. (default: true)

                    osm_fiord_color_vector_tiles:
                        type: vector_tiles
                        title: OSM Fiord Color Vector Tiles WhereGroup Demo
                        jsonUrl: https://wms.wheregroup.com/tileserver/style/osm-fiord-color.json
                        # jsonUrl: https://wms.wheregroup.com/tileserver/style/osm-bright.json
                        ## All configuration from here onwards is optional
                        isBaseSource: true
                        allowSelected: true
                        # bbox: [7.6,47.9,7.8,48.1]
                        selected: false
                        opacity: 100
                        #minScale: 0
                        #maxScale: 50000000
                        featureInfo: false
                        featureInfoAllowToggle: false
                        featureInfoTitle: ${name} (${klasse})
                        hideIfNoTitle: true
                        propertyMap:
                          - klasse
                          - name
                    osm_liberty_vector_tiles:
                        type: vector_tiles
                        title: OSM Liberty Vector Tiles WhereGroup Demo
                        jsonUrl: https://wms.wheregroup.com/tileserver/style/osm-liberty.json
                        # jsonUrl: https://wms.wheregroup.com/tileserver/style/osm-bright.json
                        ## All configuration from here onwards is optional
                        isBaseSource: true
                        allowSelected: true
                        # bbox: [7.6,47.9,7.8,48.1]
                        selected: false
                        #opacity: 100
                        #minScale: 0
                        #maxScale: 50000000
                        featureInfo: false
                        featureInfoAllowToggle: true
                        featureInfoTitle: ${name} (${klasse})
                        hideIfNoTitle: false
                        #propertyMap:
                        #  - klasse
                        #  - name
                        #  - mvt:layer: Layername
                overview:
                    selected: true
                    osm-overview:
                        type: wms
                        title: OSM Demo
                        url: https://osm-demo.wheregroup.com/service
                        version: 1.3.0
                        layers:
                            21: { name: osm,    title : OSM Demo WhereGroup,  visible: true }
                        tiled: false
                        format: image/png
                        transparent: true
                        visible: true
                        opacity: 100
                        isBaseSource: false
            elements:
                toolbar:
                    basesourceswitcher:
                        title: mb.core.basesourceswitcher.class.title
                        tooltip: mb.core.basesourceswitcher.class.title
                        class: Mapbender\CoreBundle\Element\BaseSourceSwitcher
                        display: group
                        instancesets:
                            1-basesourceswitcher:
                                title: OSM (color)
                                group: mb.demoapps.baseMaps
                                instances:
                                    - osm
                            2-basesourceswitcher:
                                title: OSM (greyscale)
                                group: mb.demoapps.baseMaps
                                instances:
                                    - osm-greyscale
                            3-basesourceswitcher:
                                title: OSM (transparent)
                                group: mb.demoapps.baseMaps
                                instances:
                                    - osm-transparent
                            4-basesourceswitcher:
                                title: OSM WMTS (color)
                                group: mb.demoapps.baseMaps
                                instances:
                                    - osm-wmts
                            5-basesourceswitcher:
                                title: OSM Liberty Vector Tiles
                                group: mb.demoapps.baseMaps
                                instances:
                                    - osm_liberty_vector_tiles
                            6-basesourceswitcher:
                                title: OSM Fiord Color Vector Tiles
                                group: mb.demoapps.baseMaps
                                instances:
                                    - osm_fiord_color_vector_tiles
                            7-basesourceswitcher:
                                title: mb.demoapps.noBackground
                                group: null
                                instances: []
                    fi-button:
                        class: Mapbender\CoreBundle\Element\ControlButton
                        icon: iconInfoActive
                        label: true
                        target: featureinfo
                        group: featureinfo
                    legend-button:
                        class: Mapbender\CoreBundle\Element\ControlButton
                        label: true
                        target: legend
                        icon: iconLegend
                        screenType: desktop
                    wmsloader-button:
                        class: Mapbender\CoreBundle\Element\ControlButton
                        label: true
                        target: wmsloader
                        icon: iconWms
                    gps-button:
                        class: Mapbender\CoreBundle\Element\GpsPosition
                        label: true
                        screenType: mobile
                    poi-button:
                        class: Mapbender\CoreBundle\Element\ControlButton
                        icon: iconPoi
                        label: true
                        target: poi
                    print-button:
                        class: Mapbender\CoreBundle\Element\ControlButton
                        label: true
                        icon: iconPrint
                        target: printclient
                    imageexport-button:
                        class: Mapbender\CoreBundle\Element\ControlButton
                        label: true
                        icon: iconImageExport
                        target: imageexport
                    shareUrl:
                        class: Mapbender\CoreBundle\Element\ShareUrl
                        label: true
                    simplesearch:
                        title: mb.core.simplesearch.class.title
                        placeholder: mb.demoapps.search
                        class: Mapbender\CoreBundle\Element\SimpleSearch
                        query_url: https://osm-photon-search.wheregroup.com/search/api?limit=20&lat=50.7163&lon=7.1366&osm_tag=!railway&osm_tag=!highway:elevator&osm_tag=!tourism&osm_tag=!amenity
                        query_key: q
                        query_format: '%s'
                        token_regex: '[^a-zA-Z0-9äöüÄÖÜß]'
                        token_regex_in: '([a-zA-ZäöüÄÖÜß]{3,})'
                        token_regex_out: '$1*'
                        collection_path: features
                        label_attribute:  '${properties.name} ${properties.street} ${properties.housenumber} ${properties.city} ${properties.country}'
                        geom_attribute: geometry
                        sourceSrs: 'EPSG:4326'
                        geom_format: GeoJSON
                        delay: 300
                        query_ws_replace: null
                        result:
                            buffer: ~
                            minscale: 500
                            maxscale: 5000
                            icon_url: '/bundles/mapbendercore/image/pin_red.png'
                            icon_offset: '-6,-32'
                content:
                    map:
                        class: Mapbender\CoreBundle\Element\Map
                        layersets: [themes,main,background themes]
                        srs: EPSG:3857
                        extents:
                            start: [772933.16,6566826.23,806786.66,6582317.62]
                            max: [-20037508.34278924,-20037508.34278924,20037508.34278924,20037508.34278924]
                        scales: [50000000,25000000,10000000,5000000,1000000,500000,100000,50000,25000,10000,7500,5000,2500,1000,500]
                        otherSrs: ["EPSG:25832","EPSG:25833","EPSG:31466","EPSG:31467","EPSG:4326"]
                    zoombar:
                        class: Mapbender\CoreBundle\Element\ZoomBar
                        components:
                            - rotation
                            - zoom_max
                            - zoom_in_out
                            - zoom_slider
                            - zoom_home
                        anchor: right-top
                        draggable: false
                    legend:
                        class: Mapbender\CoreBundle\Element\Legend
                        elementType: dialog
                        autoOpen: false
                        showLayerTitle: true
                        showGroupedLayerTitle: true
                    featureinfo:
                        class: Mapbender\CoreBundle\Element\FeatureInfo
                        deactivateOnClose: false
                        onlyValid: true
                        displayType: tabs
                        autoActivate: false
                        printResult: true
                        maxCount: 100
                        showOriginal: true
                        width: 500
                        height: 500
                        highlighting: true
                        fillColorDefault: '#ffff00'
                        strokeColorDefault: '#ff00ff'
                        opacityDefault: 25
                        strokeWidthDefault: 3
                        fillColorHover: '#00ffff'
                        strokeColorHover: '#0000ff'
                        opacityHover: 50
                        strokeWidthHover: 5
                    wmsloader:
                        class: Mapbender\WmsBundle\Element\WmsLoader
                        autoOpen: false
                        defaultFormat: 'image/png'
                        defaultInfoFormat: 'text/html'
                        splitLayers: false
                    imageexport:
                        class: Mapbender\PrintBundle\Element\ImageExport
                    printclient:
                        class: Mapbender\PrintBundle\Element\PrintClient
                        file_prefix: mapbender
                        templates:
                            - { template: a4_portrait_offical, label: A4 Portrait (official)}
                            - { template: a4_landscape_offical, label: A4 Landscape (official)}
                            - { template: a4portrait, label: A4 Portrait}
                            - { template: a4landscape, label: A4 Landscape}
                            - { template: a3portrait, label: A3 Portrait}
                            - { template: a3landscape, label: A3 Landscape}
                            - { template: a4_portrait_official_feature_data_demo, label: A4 Print with Feature Data}
                        scales: [500, 1000, 5000, 10000, 25000, 50000]
                        quality_levels:
                            - { dpi: 72 , label: Draft (72dpi)}
                            - { dpi: 288,  label: Document (288dpi)}
                        rotatable: true
                        legend: true
                        legend_default_behaviour: false
                        optional_fields:
                            title:
                                label: Title              # label of the optional field
                                options:                  #
                                    required: true        # true or false
                    overview:
                        class: Mapbender\CoreBundle\Element\Overview
                        layerset: overview
                        anchor: 'right-bottom'
                        width: 200
                        height: 150
                        screenType: desktop
                    scalebar:
                        class: Mapbender\CoreBundle\Element\ScaleBar
                        anchor: 'right-bottom'
                        maxWidth: 200
                        units: km
                        screenType: desktop
                    scaledisplay:
                        class: Mapbender\CoreBundle\Element\ScaleDisplay
                        anchor: right-top
                        scalePrefix: Scale
                        unitPrefix: true
                        screenType: desktop
                    poi:
                        class: Mapbender\CoreBundle\Element\POI
                        body: mb.demoapps.poi
                        useMailto: false
                sidepane:
                    digitizer:
                        title: Digitizer
                        class: Mapbender\DigitizerBundle\Element\Digitizer
                        target: map
                        schemes:
                            combine_schemes_together:
                                label: combine schemes (in this case poi and line)
                                searchType: currentExtent # Initial state of checkbox for limiting feature loading to current visible map portion. [all / currentExtent] (default: currentExtent).
                                combine:
                                    - poi
                                    - line
                                    - polygon
                            #     # roles: #Show this schema only to users with (at least one of) these roles
                            #     #    - root
                            #     #    - ROLE_GROUP_EDITING

                            poi:
                                label: 'point digitizing'
                                maxResults: 500 # only load limited number of feature
                                zoomBuffer: 100
                                #filterUser: true
                                #trackUser: true
                                #featureType: poi # you can define a featureType in your parameters.yaml and refer to the name in the configuration
                                featureType:
                                    connection: geodata_db
                                    table: poi
                                    uniqueId: gid
                                    geomType: point
                                    geomField: geom
                                    srid: 4326
                                    filter: ~
                                    #filter: gid < 10000'
                                    #filter: 'user_name = :userName' # use trackUser instead
                                    #userColumn: user_name
                                    styleField: style
                                    # file upload location - customization per column on featureType (or dataStore) level
                                    #files:
                                    #  - field: file_reference
                                    #    path: /data/demo/mapbender_upload_poi/
                                    #events:
                                    #    onBeforeSave: $feature->setAttribute('abstract', 'MAPS'); $feature->setAttribute('user_name', $user ); $feature->setAttribute('group_name', implode(',', $userRoles));
                                allowCustomStyle: true
                                allowChangeVisibility: false # Offer buttons to toggle feature visibility (default true)
                                allowCreate: true   # Allow new feature generation (default true)
                                allowDelete: true   # Allow geometry deletion (default true)
                                allowDigitize: true # Allow geometry creation and editing (default true)
                                allowEditData: true # Allow attribute editing (default true)
                                allowRefresh: true # Offer button to reload data (for tables frequently modified by concurrent users) (default false)

                                continueDrawingAfterSave: true # Keep drawing tool active after creating and saving a new feature (~fast batch mode feature creation) (default false)

                                displayPermanent: true # Keep features visible on map even after switching to a different schema (default false)
                                displayOnInactive: true # Keep features visible on map even after deactivating Digitizer (default false)

                                refreshLayersAfterFeatureSave:
                                    - mapbender_users # or WMS InstanceID

                                # Table
                                inlineSearch: true # Enables display filtering by search term (default true)
                                searchType: currentExtent # Initial state of checkbox for limiting feature loading to current visible map portion. [all / currentExtent] (default: currentExtent).
                                paging: true # De/activate paging in table (default true)
                                pageLength: 5 # Limits the number of rows per page in table (default 16)

                                printable: true
                                # roles: #Show this schema only to users with (at least one of) these roles
                                #    - root
                                #    - ROLE_GROUP_EDITING

                                copy:
                                    enable: true
                                    overwriteValuesWithDefault: true
                                    data:
                                        firstname: 'Paul' # every copied feature will get firstname Paul
                                        lastname: 'Meier' # every copied feature will get lastname Meier

                                toolset:
                                    -
                                        type: drawPoint
                                    -
                                        type: moveFeature

                                popup:
                                    title: 'point test suite' # Popup title text
                                    width: 500px
                                    #width: 50vw   # half screen width
                                    #modal: true # Everything except the form window is grayed out and the position and size of the window is fixed for the duration of the data collection.
                                    #position: {at: "left+200px",  my: "left top-460px"}  # Position of the popup in the browser area
                                styles:
                                    default:
                                        strokeWidth: 3
                                        strokeColor: "#00ff00"
                                        fillColor:   ${fill_color}
                                        fillOpacity: 0.9
                                        strokeOpacity: 0.8
                                        pointRadius: 10
                                        label: ${name}
                                        fontColor: black
                                        fontSize: 12
                                        fontFamily: 'Arial, Courier New, monospace'
                                        fontWeight: bold
                                        labelOutlineColor: yellow
                                        labelOutlineWidth: 1
                                        labelYOffset: -18
                                        labelXOffset: -18
                                        graphic: true
                                        externalGraphic: 'https://schulung.foss.academy/symbols/${symbol}.png'
                                        graphicWidth: 30
                                        graphicHeight: 30
                                    select:
                                        strokeWidth: 3
                                        strokeColor: "#00ffff"
                                        fillColor:   "#FF00ff"
                                        fillOpacity: 0.5
                                        pointRadius: 6
                                        label: ${gid}
                                        fontColor: green
                                        fontSize: 18
                                        labelOutlineColor: blue
                                        labelOutlineWidth: 2
                                        labelYOffset: 18
                                        labelXOffset: -18
                                    unsaved:
                                        strokeWidth: 3
                                        strokeColor: "#f0f0f0"
                                        fillColor:   "#ffffff"
                                        fillOpacity: 0.5
                                        pointRadius: 6
                                        label: 'Please save'
                                        fontColor: red
                                        fontSize: 18
                                        labelOutlineColor: #ff00ff
                                        labelOutlineWidth: 3
                                        labelYOffset: -18
                                        labelXOffset: 18

                                tableFields:
                                    gid:
                                        label: Nr.
                                        width: 20%
                                    name:
                                        label: Name
                                        width: 80%

                                formItems:
                                    -
                                        type: tabs
                                        children:
                                            -
                                                title: '1. Basic information'
                                                css:
                                                    padding: 10px
                                                children:
                                                    -
                                                        type: label
                                                        title: 'Welcome to the digitize demo. Try the new Mapbender feature!'
                                                        css:
                                                           color: red
                                                    -
                                                        type: html
                                                        html: '<p><b>Read more at the </b><a href="https://mapbender.org" target="_blank" style="color:blue;">Mapbender-Website</a>!</br>Enjoy Mapbender.</p>'

                                                    -
                                                        type: input   # Type of form input field
                                                        title: Name   # Label text for form input field
                                                        name: name
                                                        #value: 'A place to be' # Initial field value on newly created items
                                                        copyClipboard: true
                                                        infoText: 'Info: Please give a name to the new object.' # Explanatory text placed in a tooltip next to the label
                                                        mandatoryText: 'Mandatory Field: Please give a name to the poi.'
                                                        required: true
                                                        #mandatory: true #DEPRECATED please use required: true instead
                                                        css:
                                                            color: green
                                                        #cssClass: myClass # Added to the class attribute of the form group (container around label and input)
                                                        attr:
                                                            placeholder: 'Please give a name to the poi.' # placeholder. Text is not saved
                                                            #pattern: '\w{2}\d{3,}' # Two letters followed by at least three digits
                                                    -
                                                        type: input
                                                        title: Title
                                                        required: false
                                                        name: title
                                                    -
                                                        type: textArea
                                                        name: abstract
                                                        title: Abstract
                                                        mandatoryText: 'This field is mandatory'
                                                        required: true
                                                        attr:
                                                            placeholder: 'Please write an abstract'
                                                            rows: 3
                                                    -
                                                        type: select
                                                        select2: true # activates full text search for the select box (please not for multi: true full text search is activated by default)
                                                        title: Type
                                                        name: type
                                                        infoText: 'Help: Please choose a type.'
                                                        mandatoryText: 'Please give a name to the new object.'
                                                        required: true
                                                        maximumSelectionLength: 2 # maximum number of possible selections for multi-select
                                                        attr:
                                                            multiple: true
                                                        # options:
                                                        #     '': 'Please select a type...'
                                                        #     'A': 'Type A'
                                                        #     'B': 'Type B'
                                                        #     'C': 'Type C'
                                                        #     'D': 'Type D'
                                                        options:
                                                            - label: 'Please select a type...'
                                                              value: ''
                                                            # - label: 'Type A'
                                                            #   value: 'A'
                                                            # - label: 'Type B'
                                                            #   value: 'B'
                                                            # - label: 'Type C'
                                                            #   value: 'C'
                                                            # - label: 'Type D'
                                                            #   value: 'D'
                                                            #- label: 'Type E (disabled)'
                                                            #  value: 'E'
                                                            #  attr:
                                                            #      disabled: disabled
                                                        #value: A,C   # use comma-separated values for default multi-select value
                                                        connection: geodata_db
                                                        sql: SELECT type_name, type_id FROM types ORDER BY type_id ASC;
                                                    -
                                                        type: breakLine
                                                    -
                                                        type: text
                                                        title: user_name / group_name
                                                        #text: data.user_name
                                                        text: |
                                                              'USER: ' + data.user_name + ' GROUP:' + data.group_name
                                                    -   type: text     # Typ text zur Generierung von dynamischen Texten aus der Datenbank
                                                        title: 'Text with function type:text'   # Beschriftung (optional)
                                                        text: |
                                                              (function(){ var result = '';
                                                                           if(data.user_name){
                                                                               result += 'USER: ' + data.user_name;
                                                                           }else{
                                                                               result += 'USER: -' ;
                                                                           }
                                                                           if(data.user_group){
                                                                               result += ' GROUP: ' + data.group_name;
                                                                           }else{
                                                                               result += ' GROUP: -' ;
                                                                           }
                                                                           return result;})()

                                            -
                                                title: '2. Personal information'
                                                css:
                                                    padding: 10px
                                                children:
                                                    -
                                                        type: fieldSet
                                                        children:
                                                            -
                                                                type: input
                                                                title: Firstname
                                                                name: firstname
                                                                css:
                                                                    width: 30%
                                                                #focus: |
                                                                #    var inputField = el;
                                                                #    var form1 = inputField.closest(".data-manager-edit-data");
                                                                #    form1.css("background-color","#ffc0c0");
                                                                #blur: |
                                                                #    var inputField = el;
                                                                #    var form = inputField.closest(".modal-body");
                                                                #    form.css("background-color","transparent");                                                                                                       -
                                                            -
                                                                type: input
                                                                title: Lastname
                                                                name: lastname
                                                                css:
                                                                    width: 30%
                                                            -
                                                                type: input
                                                                title: E-Mail
                                                                name: email
                                                                css:
                                                                    width: 40%
                                                    -
                                                        type: fieldSet
                                                        children:
                                                            -
                                                                type: date
                                                                title: 'favorite Date'
                                                                name: date_favorite
                                                                css:
                                                                    width: 30%
                                                               # Highlight the year column when you edit the date-field
                                                               # and automatically insert the year from the date
                                                                change: |
                                                                    var inputField = el;
                                                                    var form = inputField.closest(".data-manager-edit-data");
                                                                    var yearField = form.find("[name='year']");
                                                                    var value = inputField.val()
                                                                    var year = value && value.match(/^\d{4}/)[0] || null;
                                                                    yearField.val(year);
                                                                    yearField.css("background-color","#ffc0c0");

                                                            -
                                                                type: input
                                                                title: Year
                                                                name: year
                                                                css:
                                                                    width: 20%

                                                            -
                                                                type: colorPicker
                                                                title: 'Fill Color - used for default style'
                                                                name: fill_color
                                                                value: "#ff00ff"
                                                                css:
                                                                    width: 50%
