                    searchrouter:
                        tooltip: 'Search Router'
                        target: map
                        timeoutFactor: 3
                        width: 700
                        height: 500
                        asDialog: false
                        class: Mapbender\CoreBundle\Element\SearchRouter                        
                        routes:
                            1-route:
                                title: Orte
                                class: Mapbender\CoreBundle\Component\SQLSearchEngine  
                                class_options:
                                    connection: geodata_db
                                    relation: brd.qry_gn250_p_ortslage
                                    attributes:
                                        - gid
                                        - name
                                        - gemeinde
                                        - hoehe_ger
                                        - bundesland
                                        - ewz_ger
                                    geometry_attribute: geom
                                form:
                                    name:
                                        type: 'Symfony\Component\Form\Extension\Core\Type\TextType'
                                        options:
                                            required: true
                                            label: Name
                                            # (autocomplete und Pflichtfeld)
                                            attr:
                                                data-autocomplete: 'on'
                                                placeholder: 'Please provide a name.'
                                        compare: ilike
                                    gemeinde:
                                        type: 'Symfony\Component\Form\Extension\Core\Type\TextType'
                                        options:
                                            label: Gemeinde
                                            # (kein Pflichtfeld und ilike)'
                                            required: false
                                        compare: ilike
                                results:
                                    view: table
                                    count: true
                                    exportcsv: true
                                    headers:
                                        name: Name
                                        gemeinde: Gemeinde
                                        bundesland: Bundesland
                                        ewz_ger: Einwohner
                                        hoehe_ger: Höhe
                                    callback:
                                        event: click
                                        options:
                                            buffer: 1000
                                            minScale: null
                                            maxScale: null
                                    styleMap:
                                        default:
                                            strokeColor: '#00ff00'
                                            strokeWidth: 4
                                            strokeOpacity: 1
                                            fillOpacity: 0
                                            pointRadius: 6
                                        select:
                                            strokeColor: '#ff00ff'
                                            fillColor: '#ff00ff'
                                            fillOpacity: 0.8
                                            pointRadius: 6
                                        temporary:
                                            strokeColor: '#0000ff'
                                            fillColor: '#0000ff'
                                            fillOpacity: 1
                                            pointRadius: 10

                            2-route:
                                title: Orte mit Gemeindeauswahl
                                #(mit Choice und autocomplete-using)
                                class: Mapbender\CoreBundle\Component\SQLSearchEngine
                                class_options:
                                    connection: geodata_db
                                    relation: brd.qry_gn250_p_ortslage
                                    attributes:
                                        - gid
                                        - name
                                        - gemeinde
                                        - hoehe_ger
                                        - bundesland
                                        - ewz_ger
                                    geometry_attribute: geom
                                form:
                                    name:
                                        type: 'Symfony\Component\Form\Extension\Core\Type\TextType'
                                        options:
                                            required: false
                                            label: Name
                                            # (autocomplete, distinct und reference gemeinde)
                                            attr:
                                                data-autocomplete: 'on'
                                                data-autocomplete-distinct: on
                                                data-autocomplete-using: gemeinde
                                        compare: ilike
                                    gemeinde:
                                        compare: exact
                                        type: 'Symfony\Component\Form\Extension\Core\Type\ChoiceType'
                                        options:
                                            label: Gemeinde
                                            # (mandatory and exact)
                                            required: true
                                            placeholder: Bitte wählen Sie eine Gemeinde aus
                                            choices:
                                                Bonn: Bonn
                                                Bornheim: Bornheim
                                                Köln: Köln
                                                Siegburg: Siegburg
                                                Wesseling: Wesseling
                                results:
                                    view: table
                                    count: false
                                    exportcsv: false
                                    headers:
                                        name: Name
                                        gemeinde: Gemeinde
                                        bundesland: Bundesland
                                        ewz_ger: Einwohner
                                        hoehe_ger: Höhe
                                    callback:
                                        event: click
                                        options:
                                            buffer: 1000
                                            minScale: null
                                            maxScale: null
                                    styleMap:
                                        default:
                                            strokeColor: '#00ff00'
                                            strokeWidth: 4
                                            strokeOpacity: 1
                                            fillOpacity: 0.8
                                            fillColor: '#00ff00'
                                            pointRadius: 6
                                        select:
                                            strokeColor: '#ff00ff'
                                            strokeWidth: 4
                                            fillColor: '#ff00ff'
                                            fillOpacity: 0.8
                                            pointRadius: 20
                                        temporary:
                                            strokeColor: '#0000ff'
                                            strokeWidth: 4
                                            fillColor: '#0000ff'
                                            fillOpacity: 1
                                            pointRadius: 16

                            3-route:
                                title: Städte und Gemeinden
                                class: Mapbender\CoreBundle\Component\SQLSearchEngine
                                class_options:
                                    connection: geodata_db
                                    relation: brd.vg_250_gem
                                    attributes:
                                        - gid
                                        - gen
                                        - des
                                    geometry_attribute: geom
                                form:
                                    gen:
                                        type: 'Symfony\Component\Form\Extension\Core\Type\TextType'
                                        options:
                                            required: false
                                            label: Name
                                            # (autocomplete, distinct und reference gemeinde)
                                            attr:
                                                data-autocomplete: 'on'
                                                data-autocomplete-distinct: on
                                                data-autocomplete-using: des
                                        compare: ilike
                                    des:
                                        compare: exact
                                        type: 'Symfony\Component\Form\Extension\Core\Type\ChoiceType'
                                        options:
                                            label: 'Stadt oder Gemeinde'
                                            required: false
                                            placeholder: Bitte wählen Sie Stadt oder Gemeinde aus
                                            choices:
                                                Gemeinde: Gemeinde
                                                Stadt: Stadt
                                results:
                                    view: table
                                    count: true
                                    exportcsv: true
                                    headers:
                                        gen: Gemeinde
                                        des: Stadt/Gemeinde
                                    callback:
                                        event: click
                                        options:
                                            buffer: 5000
                                            minScale: null
                                            maxScale: null
                                    styleMap:
                                        default:
                                            strokeColor: '#ff0000'
                                            strokeWidth: 4
                                            strokeOpacity: 1
                                            fillOpacity: 0
                                            fillColor: '#ff0000'
                                                                                     
                                        select:
                                            strokeColor: '#ff00ff'
                                            strokeWidth: 4
                                            strokeOpacity: 1
                                            fillColor: '#ff00ff'
                                            fillOpacity: 0.5
                                                                                      
                                        temporary:
                                            strokeColor: '#0000ff'
                                            strokeWidth: 4
                                            strokeOpacity: 0.5
                                            fillColor: '#0000ff'
                                            fillOpacity: 0.5
                                            

