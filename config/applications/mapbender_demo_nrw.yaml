parameters:
    applications:
        mapbender_demo_nrw:
            title: Mapbender Demo NRW with many elements in action
            screenshot: mapbender_user.png
            description: Mapbender Demo zur Veranschaulichung der YAML-Definition
            published: true
            persistentView: false            
            template:  Mapbender\CoreBundle\Template\Fullscreen
            mapEngineCode: current            
            regionProperties:
              - name: toolbar
                properties:
                    item_alignment": left  # left/right/center
                    screenType: all         # desktop/mobile/all
                    generate_button_menu: false # true/false
                    menu_label: "Menu" # NULL or text
              - name: sidepane
                properties:
                    name: accordion # tabs (for button) / accordion / NULL
                    align: right # right/left
                    closed: false # true/false
                    screenType: all # all/desktop/mobile
                    width: "654px"
                    resizable: true
              - name: footer
                properties:
                    item_alignment": right # right/left/center
                    screenType: all # all/desktop/mobile
                    generate_button_menu: false # true/false
                    menu_label: "Menu" # NULL or text
            layersets:
                main:
                    selected: true
                themes:
                    selected: true
                    mapbender_users:
                        type: wms
                        title: Mapbender Users
                        url: https://wms.wheregroup.com/cgi-bin/mapbender_user.xml
                        version: 1.3.0
                        layers:
                            4: { name: Mapbender_User,    title : User, visible: true, legendurl: https://wms.wheregroup.com/cgi-bin/mapbender_user.xml?version=1.3.0&service=WMS&request=GetLegendGraphic&sld_version=1.1.0&layer=Mapbender_User&format=image/png&STYLE=default }
                            5: { name: Mapbender_Names,   title : Name, visible: true, queryable: true}
                        info_format: text/html
                        visible: true
                        format: image/png
                        transparent: true
                        tiled: false
                        opacity: 100
                        isBaseSource: false
                        toggle: true
                    fossgis:
                        type: wms
                        title: FOSSGIS Konferenzen
                        url: https://wms.wheregroup.com/cgi-bin/fossgis.xml
                        version: 1.3.0
                        layers:
                            6: { name: FOSSGIS, title : FOSSGIS Konferenz-Standorte, visible: true, queryable: true, legendurl: https://wms.wheregroup.com/cgi-bin/fossgis.xml?version=1.3.0&service=WMS&request=GetLegendGraphic&sld_version=1.1.0&layer=fossgis&format=image/png&STYLE=default }
                        info_format: text/html
                        visible: true
                        format: image/png
                        transparent: true
                        tiled: false
                        opacity: 100
                        isBaseSource: false
                        toggle: false
                    foss4g:
                        type: wms
                        title: FOSS4G Conferences
                        url: https://wms.wheregroup.com/cgi-bin/foss4g.xml
                        version: 1.3.0
                        layers:
                            6: { name: FOSS4G, title : FOSS4G Conference Locations, visible: true, queryable: true, legendurl: https://wms.wheregroup.com/cgi-bin/foss4g.xml?version=1.3.0&service=WMS&request=GetLegendGraphic&sld_version=1.1.0&layer=foss4g&format=image/png&STYLE=default }
                        info_format: text/html
                        visible: false
                        format: image/png
                        transparent: true
                        tiled: false
                        opacity: 100
                        isBaseSource: false
                        toggle: false
                background themes:
                    selected: true
                    osm:
                        type: wms
                        title: OSM Demo
                        url: https://osm-demo.wheregroup.com/service
                        version: 1.3.0
                        layers:
                            12: { name: osm,    title : OSM Demo WhereGroup,  visible: true }
                        info_format: text/html
                        visible: true
                        format: image/png
                        transparent: true
                        tiled: true
                        opacity: 100
                        isBaseSource: true
                    osm-transparent:
                        type: wms
                        title: OSM Demo
                        url: https://osm-demo.wheregroup.com/service
                        version: 1.3.0
                        layers:
                            12: { name: osm,    title : OSM Demo WhereGroup,  visible: true }
                        info_format: text/html
                        visible: false
                        format: image/png
                        transparent: true
                        tiled: true
                        opacity: 60
                        isBaseSource: true
                    osm-greyscale:
                        type: wms
                        title: OSM Demo
                        url: https://osm-demo.wheregroup.com/service
                        version: 1.3.0
                        layers:
                            13: { name:  osm-grey,    title : OSM Demo WhereGroup (greyscale),  visible: true }
                        info_format: text/html
                        visible: false
                        format: image/png
                        transparent: true
                        tiled: true
                        opacity: 100
                        isBaseSource: true
                    osm-wmts:
                        type: wmts
                        title: OpenStreetMap (OSM) Demo WhereGroup WMTS
                        isBaseSource: true
                        opacity: 100
                        url: https://osm-demo.wheregroup.com/wmts/1.0.0/WMTSCapabilities.xml
                        selected: false
                        allowSelected: true
                        toggle: false
                        allowToggle: true
                        layers:
                            osm:
                              title: OpenStreetMap (color)
                              active: true # if false, the layer is ignored (default: true)
                              selected: true # initial state of the layer. (default: true)
                              allowSelected: true # can the user change state in the layertree? If selected and allowSelected are both false, the layer is ignored. (default: true)
                            osm-grey:
                              title: OpenStreetMap (greyscale)
                              active: false # if false, the layer is ignored (default: true)
                              selected: true # initial state of the layer. (default: true)
                              allowSelected: true # can the user change state in the layertree? If selected and allowSelected are both false, the layer is ignored. (default: true)

                    osm_fiord_color_vector_tiles:
                        type: vector_tiles
                        title: OSM Fiord Color Vector Tiles WhereGroup Demo
                        jsonUrl: https://wms.wheregroup.com/tileserver/style/osm-fiord-color.json
                        # jsonUrl: https://wms.wheregroup.com/tileserver/style/osm-bright.json
                        ## All configuration from here onwards is optional
                        isBaseSource: true
                        allowSelected: true
                        # bbox: [7.6,47.9,7.8,48.1]
                        selected: false
                        opacity: 100
                        #minScale: 0
                        #maxScale: 50000000
                        featureInfo: false
                        featureInfoAllowToggle: false
                        featureInfoTitle: ${name} (${klasse})
                        hideIfNoTitle: true
                        propertyMap:
                          - klasse
                          - name
                    osm_liberty_vector_tiles:
                        type: vector_tiles
                        title: OSM Liberty Vector Tiles WhereGroup Demo
                        jsonUrl: https://wms.wheregroup.com/tileserver/style/osm-liberty.json
                        # jsonUrl: https://wms.wheregroup.com/tileserver/style/osm-bright.json
                        ## All configuration from here onwards is optional
                        isBaseSource: true
                        allowSelected: true
                        # bbox: [7.6,47.9,7.8,48.1]
                        selected: false
                        #opacity: 100
                        #minScale: 0
                        #maxScale: 50000000
                        featureInfo: false
                        featureInfoAllowToggle: true
                        featureInfoTitle: ${name} (${klasse})
                        hideIfNoTitle: false
                        #propertyMap:
                        #  - klasse
                        #  - name
                        #  - mvt:layer: Layername
                overview:
                    selected: true
                    osm-overview:
                        type: wms
                        title: OSM Demo
                        url: https://osm-demo.wheregroup.com/service
                        version: 1.3.0
                        layers:
                            21: { name: osm,    title : OSM Demo WhereGroup,  visible: true }
                        tiled: false
                        format: image/png
                        transparent: true
                        visible: true
                        opacity: 100
                        isBaseSource: false
                'NRW ALKIS':
                    selected: true
                    alkis:
                        type: wms
                        title: NRW Alkis (farbig)
                        url: https://www.wms.nrw.de/geobasis/wms_nw_alkis
                        version: 1.3.0
                        layers:
                            411: { name: adv_alkis_flurstuecke,    title : Flurstücke, visible: true, legendurl: http://www.wms.nrw.de/aaa-suite/wms-resources/external-graphics/alkis/wms/lgnd/ALKIS-WMS-Flurstueck-Grenzen_Bezeichnungen_farbe.png}
                            412: { name: adv_alkis_gebaeude,   title : Gebäude, visible: true, queryable: true, legendurl: http://www.wms.nrw.de/aaa-suite/wms-resources/external-graphics/alkis/wms/lgnd/ALKIS-WMS-Gebaeude_farbe.png}
                        info_format: text/html
                        visible: true
                        format: image/png
                        transparent: true
                        tiled: false
                        opacity: 100
                        isBaseSource: false
                        toggle: true
                    alkis-grau:
                        type: wms
                        title: NRW Alkis (grau)
                        url: https://www.wms.nrw.de/geobasis/wms_nw_alkis_grau
                        version: 1.3.0
                        layers:
                            511: { name: adv_alkis_flurstuecke,    title : Flurstücke, visible: true, legendurl: https://www.wms.nrw.de/legends/geobasis/wms_nw_alkis_grau/ALKIS-WMS-Legende_Flurstueck-Grenzen_Bezeichnungen_sw.png}
                            512: { name: adv_alkis_gebaeude,   title : Gebäude, visible: true, queryable: true, legendurl: https://www.wms.nrw.de/legends/geobasis/wms_nw_alkis_grau/ALKIS-WMS-Legende_Gebaeude_sw.png}
                        info_format: text/html
                        visible: true
                        format: image/png
                        transparent: true
                        tiled: false
                        opacity: 100
                        isBaseSource: false
                        toggle: true    
                'NRW Allgemein':
                    selected: true
                    verwaltungsgrenzen_nrw:
                        type: wms
                        title: Verwaltungsgrenzen NRW
                        url: https://www.wms.nrw.de/geobasis/wms_nw_dvg
                        version: 1.3.0
                        layers:
                            513: { name: WMS_NW_DVG,    title : Verwaltungsgrenzen NRW, visible: true}
                        info_format: text/html
                        visible: true
                        format: image/png
                        transparent: true
                        tiled: false
                        opacity: 100
                        isBaseSource: false
                        toggle: true
                Raumbezug:
                    selected: true
                    Bodenbewegungsgebiete:
                        type: wms
                        title: 3 WMS NW Bodenbewegungsgebiete Kacheln
                        url: https://www.wms.nrw.de/geobasis/wms_nw_bodenbewegungsgebiete_kacheln
                        version: 1.3.0
                        layers:
                            100: { name: WMS_NW_BODENBEWEGUNGSGEBIETE_KACHELN,    title : WMS NW Bodenbewegungsgebiete Kacheln,  visible: true }
                        info_format: text/html
                        visible: true
                        format: image/png
                        transparent: true
                        tiled: false
                        opacity: 100
                        isBaseSource: false
                        toggle: true

                Luftbildinformation:
                    selected: true
                    overlay:
                        type: wms
                        title: 4 NW Overlay für DOP
                        url: https://www.wms.nrw.de/geobasis/wms_nw_dop_overlay
                        version: 1.3.0
                        layers:
                            110: { name: WMS_NW_DOP_OVERLAY,    title : Overlay für DOP}
                        info_format: text/html
                        visible: true
                        format: image/png
                        transparent: true
                        tiled: false
                        opacity: 100
                        isBaseSource: false
                        toggle: true

                    dop:
                        type: wms
                        title: 5 NW DOP
                        url: https://www.wms.nrw.de/geobasis/wms_nw_dop
                        version: 1.3.0
                        layers:
                            120: { name: nw_dop_rgb,    title : WMS NW DOP RGB,  visible: true }
                        info_format: text/html
                        visible: true
                        format: image/png
                        transparent: true
                        tiled: true
                        opacity: 100
                        isBaseSource: false
                        toggle: true

                    dop-cir:
                        type: wms
                        title: 6 NW DOP Colorinfrarot
                        url: https://www.wms.nrw.de/geobasis/wms_nw_dop
                        version: 1.3.0
                        layers:
                            130: { name: nw_dop_cir,    title : WMS NW DOP Colorinfrarot,  visible: true }
                        info_format: text/html
                        visible: true
                        format: image/png
                        transparent: true
                        tiled: true
                        opacity: 100
                        isBaseSource: true
                        toggle: true

                'Touristik und Freizeit':
                    tfis:
                        type: wms
                        title: 2 WMS NW TFIS
                        url: http://www.wms.nrw.de/geobasis/wms_nw_tfis
                        version: 1.3.0
                        layers:
                            200: { name: nw_tfis,    title : 'Touristik und Freizeitinformation NRW',  visible: true , , queryable: true , legendurl: https://www.wms.nrw.de/legends/geobasis/wms_nw_tfis/Legende_TFIS.png }
                        info_format: text/html
                        visible: true
                        format: image/png
                        transparent: true
                        tiled: false
                        opacity: 100
                        isBaseSource: false
                        toggle: true


            elements:
                toolbar:
                    basesourceswitcher:
                        title: mb.core.basesourceswitcher.class.title
                        tooltip: mb.core.basesourceswitcher.class.title
                        class: Mapbender\CoreBundle\Element\BaseSourceSwitcher
                        display: group
                        target: map
                        instancesets:
                            1-basesourceswitcher:
                                title: OSM (color)
                                group: mb.demoapps.baseMaps
                                instances:
                                    - osm
                            2-basesourceswitcher:
                                title: OSM (greyscale)
                                group: mb.demoapps.baseMaps
                                instances:
                                    - osm-greyscale
                            3-basesourceswitcher:
                                title: OSM (transparent)
                                group: mb.demoapps.baseMaps
                                instances:
                                    - osm-transparent
                            4-basesourceswitcher:
                                title: OSM WMTS (color)
                                group: mb.demoapps.baseMaps
                                instances:
                                    - osm-wmts
                            5-basesourceswitcher:
                                title: OSM Liberty Vector Tiles
                                group: mb.demoapps.baseMaps
                                instances:
                                    - osm_liberty_vector_tiles
                            6-basesourceswitcher:
                                title: OSM Fiord Color Vector Tiles
                                group: mb.demoapps.baseMaps
                                instances:
                                    - osm_fiord_color_vector_tiles
                            7-basesourceswitcher:
                                title: mb.demoapps.noBackground
                                group: null
                                instances: []

                    resetview:
                        title: mb.core.resetView.class.title
                        class: Mapbender\CoreBundle\Element\ResetView
                        configuration:
                            label: true
                            tooltip: null
                            resetDynamicSources: true

                    fi-button:
                        class: Mapbender\CoreBundle\Element\ControlButton
                        icon: iconInfoActive
                        label: true
                        target: featureinfo
                        group: featureinfo
                    legend-button:
                        class: Mapbender\CoreBundle\Element\ControlButton
                        label: true
                        target: legend
                        icon: iconLegend
                    wmsloader-button:
                        class: Mapbender\CoreBundle\Element\ControlButton
                        label: true
                        target: wmsloader
                        icon: iconWms
                    gps-button:
                        class: Mapbender\CoreBundle\Element\GpsPosition
                        label: true
                        target: map
                        screenType: mobile
                    poi-button:
                        class: Mapbender\CoreBundle\Element\ControlButton
                        icon: iconPoi
                        label: true
                        target: poi
                    print-button:
                        class: Mapbender\CoreBundle\Element\ControlButton
                        label: true
                        icon: iconPrint
                        target: printclient
                    imageexport-button:
                        class: Mapbender\CoreBundle\Element\ControlButton
                        label: true
                        icon: iconImageExport
                        target: imageexport
                    shareUrl:
                        class: Mapbender\CoreBundle\Element\ShareUrl
                        label: true
                    simplesearch:
                        title: mb.core.simplesearch.class.title
                        placeholder: mb.demoapps.search
                        class: Mapbender\CoreBundle\Element\SimpleSearch
                        target: map
                        query_url: https://osm-photon-search.wheregroup.com/search/api?limit=20&lat=50.7163&lon=7.1366&osm_tag=!railway&osm_tag=!highway:elevator&osm_tag=!tourism&osm_tag=!amenity
                        query_key: q
                        query_format: '%s'
                        token_regex: '[^a-zA-Z0-9äöüÄÖÜß]'
                        token_regex_in: '([a-zA-ZäöüÄÖÜß]{3,})'
                        token_regex_out: '$1*'
                        collection_path: features
                        label_attribute:  '${properties.name} ${properties.street} ${properties.housenumber} ${properties.city} ${properties.country}'
                        geom_attribute: geometry
                        sourceSrs: 'EPSG:4326'
                        geom_format: GeoJSON
                        delay: 300
                        query_ws_replace: null
                        result:
                            buffer: ~
                            minscale: 500
                            maxscale: 5000
                            icon_url: '/bundles/mapbendercore/image/pin_red.png'
                            icon_offset: '-6,-32'

                content:
                    map:
                        title: mb.core.map.class.title
                        class: Mapbender\CoreBundle\Element\Map
                        layersets: [themes,main,'Touristik und Freizeit',Raumbezug,'NRW ALKIS','NRW Allgemein',Luftbildinformation,background themes]
                        srs: EPSG:25832
                        extents:
                            start: [361000,5619000,371150,5625000]
                            max: [-500000,4350000,1600000,6850000]
                        scales: [5000000,1000000,500000,100000,50000,25000,10000,7500,5000,2500,1000,500]
                        otherSrs: ["EPSG:25833","EPSG:31466","EPSG:31467","EPSG:3857","EPSG:4326"]


                    simplesearch:
                        title: mb.core.simplesearch.class.title
                        placeholder: mb.demoapps.search
                        class: Mapbender\CoreBundle\Element\SimpleSearch
                        target: map
                        query_url: 'http://geodaten.metropoleruhr.de/suche?wt=json&indent=true&rows=10'                        
                        #only Bonn
                        #query_url: 'http://geodaten.metropoleruhr.de/suche?wt=json&indent=true&rows=10&fq=onm:Bonn'
                        query_key: q
                        query_format: '%s'
                        token_regex: '[^a-zA-Z0-9äöüÄÖÜß]'
                        token_regex_in: '([a-zA-ZäöüÄÖÜß]{3,})'
                        token_regex_out: '$1*'
                        collection_path: features
                        label_attribute:  '${properties.name} ${properties.street} ${properties.housenumber} ${properties.city} ${properties.country}'
                        geom_attribute: geometry
                        sourceSrs: 'EPSG:4326'
                        geom_format: GeoJSON
                        delay: 300
                        query_ws_replace: null
                        result:
                            buffer: ~
                            minscale: !!float 100
                            maxscale: !!float 1000
                            icon_url: '/bundles/mapbendercore/image/pin_red.png'
                            icon_offset: '-6,-32'

                    zoombar:
                        class: Mapbender\CoreBundle\Element\ZoomBar
                        target: map
                        components:
                            - rotation
                            - zoom_max
                            - zoom_in_out
                            - zoom_slider
                            - zoom_home
                        stepSize: 50
                        stepByPixel: true
                        anchor: right-top
                        draggable: false

                    legend:
                        class: Mapbender\CoreBundle\Element\Legend
                        target: map
                        title: mb.core.legend.class.title
                        elementType: dialog
                        autoOpen: false
                        displayType: list
                        showWmsTitle: true
                        showLayerTitle: true
                        showGroupedLayerTitle: true

                    featureinfo:
                        class: Mapbender\CoreBundle\Element\FeatureInfo
                        title: mb.core.featureinfo.class.title
                        target: map
                        deactivateOnClose: false
                        onlyValid: true
                        type: dialog
                        displayType: tabs
                        autoActivate: false
                        printResult: true
                        maxCount: 100
                        showOriginal: true
                        width: 500
                        height: 500
                        highlighting: true
                        fillColorDefault: '#ffff00'
                        strokeColorDefault: '#ff00ff'
                        opacityDefault: 25
                        strokeWidthDefault: 3
                        fillColorHover: '#00ffff'
                        strokeColorHover: '#0000ff'
                        opacityHover: 50
                        strokeWidthHover: 5

                    wmsloader:
                        title: mb.wms.wmsloader.class.title
                        class: Mapbender\WmsBundle\Element\WmsLoader
                        target: map
                        autoOpen: false
                        defaultFormat: 'image/png'
                        defaultInfoFormat: 'text/html'
                        splitLayers: false

                    imageexport:
                        class: Mapbender\PrintBundle\Element\ImageExport
                        target: map
                        title: Image export

                    printclient:
                        title: mb.core.printclient.class.title
                        class: Mapbender\CoreBundle\Element\PrintClient
                        target: map
                        file_prefix: mapbender
                        templates:
                            - { template: a4_portrait_offical, label: A4 Portrait (official)}
                            - { template: a4_landscape_offical, label: A4 Landscape (official)}
                            - { template: a4portrait, label: A4 Portrait}
                            - { template: a4landscape, label: A4 Landscape}
                            - { template: a3portrait, label: A3 Portrait}
                            - { template: a3landscape, label: A3 Landscape}
                        scales: [500, 1000, 5000, 10000, 25000, 50000]
                        quality_levels:
                            - { dpi: 72 , label: Draft (72dpi)}
                            - { dpi: 288,  label: Document (288dpi)}
                        rotatable: true
                        legend: true
                        legend_default_behaviour: false
                        optional_fields:
                            title:
                                label: Title              # label of the optional field
                                options:                  #
                                    required: true        # true or false

                    lineruler:
                        title: mb.core.ruler.tag.line
                        tooltip: 'ruler'
                        class: Mapbender\CoreBundle\Element\Ruler
                        target: map
                        type: line

                    arearuler:
                        title: mb.core.ruler.tag.area
                        tooltip: 'area'
                        class: Mapbender\CoreBundle\Element\Ruler
                        target: map
                        type: area

                    scalebar:
                        class: Mapbender\CoreBundle\Element\ScaleBar
                        target: map
                        anchor: 'left-bottom'
                        maxWidth: 200
                        units: km

                    overview:
                        title: mb.core.overview.class.title
                        class: Mapbender\CoreBundle\Element\Overview
                        target: map
                        layerset: overview
                        width: 200
                        height: 100
                        anchor: 'right-bottom'
                        visibility: open # open/closed/open-permanent
                        fixed: false
                        screenType: desktop
                    scaledisplay:
                        title: mb.core.scaledisplay.class.title
                        class: Mapbender\CoreBundle\Element\ScaleDisplay
                        target: map
                        anchor: left-top
                        scalePrefix: Scale
                        unitPrefix: true

                    poi:
                        title: mb.core.poi.class.title
                        class: Mapbender\CoreBundle\Element\POI
                        target: map
                        body: 'Please take a look at this POI'
                        useMailto: false

                sidepane:
                    layertree:
                        title: mb.core.layertree.class.title
                        class: Mapbender\CoreBundle\Element\Layertree
                        target: map
                        type: element
                        autoOpen: false
                        showBaseSource: false
                        layerRemove: true
                        menu: [opacity,zoomtolayer,metadata]
                        hideNotToggleable: true
                        hideSelect: true
                        hideInfo: false
                        useTheme: true
                        themes:
                            -
                                id: main
                                title: main
                                useTheme: true
                                opened: true
                                sourceVisibility: false
                                allSelected: false
                            -
                                id: themes
                                title: mb.demoapps.themes
                                useTheme: true
                                opened: true
                                sourceVisibility: false
                                allSelected: false
                            -
                                id: Raumbezug
                                title: Raumbezug
                                useTheme: true
                                opened: true
                                sourceVisibility: false
                                allSelected: false
                            -
                                id: 'Touristik und Freizeit'
                                title: 'Touristik und Freizeit'
                                useTheme: true
                                opened: true
                                sourceVisibility: false
                                allSelected: false
                            -
                                id: Luftbildinformation
                                title: Luftbildinformation
                                useTheme: true
                                opened: true
                                sourceVisibility: false
                                allSelected: false
                            -
                                id: 'NRW ALKIS'
                                title: 'NRW ALKIS'
                                useTheme: true
                                opened: true
                                sourceVisibility: false
                                allSelected: false
                            -
                                id: 'NRW Allgemein'
                                title: 'NRW Allgemein'
                                useTheme: true
                                opened: true
                                sourceVisibility: false
                                allSelected: false
                            -
                                id: background themes
                                title: mb.demoapps.backgroundThemes
                                useTheme: true
                                opened: true
                                sourceVisibility: false
                                allSelected: false
                    ruler:
                        class: Mapbender\CoreBundle\Element\Ruler
                        target: map
                        type: both
                        fillColor: 'rgba(254, 254, 254, 0.2)'
                        strokeColor: 'rgba(51,153,204, 1)'
                        fontColor: 'rgba(51,153,204, 1)'
                        fontSize: 14
                        strokeWidth: 2
                        strokeWidthWhileDrawing: 3
                        screenType: desktop
                    sketch:
                        class: Mapbender\CoreBundle\Element\Sketch
                        target: map
                        geometrytypes:
                            - point
                            - line
                            - polygon
                            - text
                            - rectangle
                            - circle
                        auto_activate: false
                        deactivate_on_close: false
